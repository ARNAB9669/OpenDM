<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in | Open DM</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar"><div class="logo">Open DM Admin</div></nav>
    <main class="admin-container"><div class="card">
        <h2>Administrator sign in</h2>
        <p>Only the configured administrator can access the console.</p>
        <form id="login-form">
            <input id="email" type="email" placeholder="admin@company.com" required autocomplete="email">
            <button id="submit-btn" type="submit">Send sign-in link</button>
        </form>
        <div id="login-status" role="status"></div>
    </div></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
