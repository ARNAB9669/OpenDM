<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Open DM</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <!-- Supabase CDN required for session verification -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Open DM Admin</div>
        <div class="nav-links">
            <button id="admin-logout-btn" class="btn-outline">Logout</button>
        </div>
    </nav>
    <main class="admin-container wide">

        <div class="dashboard-grid">
            <!-- Invite Client Form -->
            <div class="card invite-card">
                <h2>Invite New Client</h2>
                <p>Creates a workspace and sends a magic login link.</p>
                <form id="invite-form">
                    <input type="email" id="client-email" placeholder="client@brand.com" required>
                    <input type="text" id="workspace-name" placeholder="Client workspace name" required maxlength="100">
                    <button type="submit" id="invite-btn">Send Invite</button>
                </form>
                <div id="invite-status"></div>
            </div>

        </div>
    </main>
    <script type="module" src="/admin/admin.js"></script>
</body>

</html>
