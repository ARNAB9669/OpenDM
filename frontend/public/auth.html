<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Open DM</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Open DM</div>
    </nav>
    <main class="admin-container">
        <div class="card">
            <h2>Sign in to your workspace</h2>
            <p>Open DM is invite-only. Use the email address that received your invitation.</p>
            <form id="auth-form">
                <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
                <button type="submit" id="submit-btn">Send sign-in link</button>
            </form>
            <div id="auth-message" role="status"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
