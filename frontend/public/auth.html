<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | Open DM</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Open DM Admin</div>
    </nav>
    <main class="admin-container">
        <div class="card">
            <h2>Invite New Client</h2>
            <p>Creates a workspace and sends a magic login link.</p>
            <form id="invite-form">
                <input type="email" id="client-email" placeholder="client@brand.com" required>
                <button type="submit" id="invite-btn">Send Invite</button>
            </form>
            <div id="invite-status"></div>
        </div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
